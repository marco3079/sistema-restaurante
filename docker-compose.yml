services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: restaurante
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurante}
      POSTGRES_DB: restaurante
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - dados_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurante -d restaurante"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://restaurante:${POSTGRES_PASSWORD:-restaurante}@db:5432/restaurante?schema=public"
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-de-exemplo}
      PORT: "3000"
      ADMIN_NOME: ${ADMIN_NOME:-Gestor}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-gestor@restaurante.local}
      ADMIN_SENHA: ${ADMIN_SENHA:-gestor1234}
      SEED_DEMO: ${SEED_DEMO:-false}
      TZ: ${TZ:-America/Sao_Paulo}
      ATUALIZADOR_URL: "http://atualizador:4000"
      ATUALIZADOR_SEGREDO: ${JWT_SECRET:-troque-este-segredo-de-exemplo}
    ports:
      - "127.0.0.1:${API_PORT:-3091}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    build: ./client
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8091}:80"
    restart: unless-stopped

  # Atualiza o sistema para o último commit do GitHub (botão em Configurações > Atualização).
  # Tem acesso ao Docker do computador e à pasta do projeto; só a API fala com ele, pela rede interna.
  atualizador:
    build: ./atualizador
    environment:
      ATUALIZADOR_SEGREDO: ${JWT_SECRET:-troque-este-segredo-de-exemplo}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - .:/projeto
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  dados_db:
